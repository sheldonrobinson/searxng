# File: .github/workflows/release.yml
name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches: [ compat ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]

    steps:
      # Step 1: Checkout source code
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          
      - uses: actions/setup-python@v6
        with:
           python-version: "3.14"

      - name: Install build
        run: python -m pip install build

      - name: Build wheels
        run: python -m build --wheel --outdir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: searxng-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          
      - name: Publish to PyPI
        if: matrix.os == 'ubuntu-latest'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload --repository-url https://upload.pypi.org/legacy/ --skip-existing ./wheelhouse/*.whl
          
