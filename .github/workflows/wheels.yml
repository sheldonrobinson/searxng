name: Build

on:
  push:
    branches: [ compat ]
    tags:
      - 'v*.*.*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true 
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
           python-version: "3.14"
          
      - name: Install build
        run: python -m pip install build

      - name: Build wheels
        run: python -m build --wheel --outdir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: searxng-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
