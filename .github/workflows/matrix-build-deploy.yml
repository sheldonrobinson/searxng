# File: .github/workflows/release.yml
name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches: [ compat ]
    tags:
      - 'v*.*.*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
      # Step 1: Checkout source code
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
           python-version: "3.14"
           
      - uses: actions/setup-go@v7
        with:
          # Version or version range of Go to use
          go-version: '1.23'

      # Used to host cibuildwheel
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        # to supply options, put them in 'env', like:
        env:
          build: "cp310-*,cp311-*,cp312-*,cp313-*,cp314-*"
        with:
           package-dir: .
           output-dir: ./wheelhouse
           
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
      - name: pypi-publish
        # You may pin to the exact commit or the version.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # PyPI user
          user: ${{ secrets.PYPI_USER }}
          # Password for your PyPI user or an access token
          password: ${{ secrets.PYPI_TOKEN }} # optional
          # The repository URL to use
          repository-url: https://pypi.org/p/searxng-server
          # The target for distribution
          packages-dir: ./wheelhouse
          # Check metadata before uploading
          verify-metadata: true
          
