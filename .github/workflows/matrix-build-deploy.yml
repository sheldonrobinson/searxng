# File: .github/workflows/release.yml
name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches: [ compat ]
    tags:
      - 'v*.*.*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]

    steps:
      # Step 1: Checkout source code
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          
      - uses: actions/setup-python@v6
        with:
           python-version: "3.14"

      - name: Install build
        run: python -m pip install build

      - name: Build wheels
        run: python -m build --wheel --outdir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: searxng-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          
      - name: pypi-publish
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        # You may pin to the exact commit or the version.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # PyPI user (__token__ for API token authentication)
          user: __token__
          # Password for your PyPI user or an access token
          password: ${{ secrets.PYPI_TOKEN }}
          # The repository URL to use
          repository-url: https://upload.pypi.org/legacy/
          # The target directory for distribution
          packages-dir: ./wheelhouse
          # Check metadata before uploading
          verify-metadata: true
          # Do not fail if a Python package distribution already exists
          skip-existing: true
          
