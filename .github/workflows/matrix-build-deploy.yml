# File: .github/workflows/release.yml
name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches: [ compat ]
    tags:
      - 'v*.*.*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
      # Step 1: Checkout source code
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
           python-version: "3.14"
           
      - uses: actions/setup-go@v7
        with:
          # Version or version range of Go to use
          go-version: '1.23'

      # Used to host cibuildwheel
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        # to supply options, put them in 'env', like:
        env:
          build: ["cp310-*", "cp311-*", "cp312-*", 'cp313-*", "cp314-*"]
        with:
           package-dir: .
           output-dir: wheelhouse
           
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
      - name: pypi-publish
        # You may pin to the exact commit or the version.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # PyPI user
          user: # optional, default is __token__
          # Password for your PyPI user or an access token
          password: # optional
          # The repository URL to use
          repository-url: # optional
          # The target directory for distribution
          packages-dir: # optional
          # Check metadata before uploading
          verify-metadata: # optional
          # Do not fail if a Python package distribution exists in the target package index
          skip-existing: # optional
          # Show verbose output.
          verbose: # optional, default is true
          # Show hash values of files to be uploaded
          print-hash: # optional
          # Enable support for PEP 740 attestations. Only works with PyPI and TestPyPI via Trusted Publishing.
          attestations: # optional, default is true
